name: Android demo
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke (no API) or optional free-tier AI agent'
        type: choice
        options: [smoke, agent]
        default: smoke
permissions:
  contents: read
concurrency:
  group: public-android-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Install agent only on explicit request
        if: inputs.mode == 'agent'
        run: python -m pip install mobilerun==0.7.4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run public Android demo
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DEMO_MODE: ${{ inputs.mode }}
          GOOGLE_API_KEY: ${{ inputs.mode == 'agent' && secrets.GOOGLE_API_KEY || '' }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python demo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-demo-evidence
          path: out/
          if-no-files-found: ignore
          retention-days: 3
