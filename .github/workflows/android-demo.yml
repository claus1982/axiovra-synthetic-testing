name: Android demo
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke, local AI (no API), or optional Gemini'
        type: choice
        options: [smoke, local, agent]
        default: smoke
permissions:
  contents: read
concurrency:
  group: public-android-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Install agent only on explicit request
        if: inputs.mode != 'smoke'
        run: python -m pip install mobilerun==0.7.4
      - name: Check Gemini authorization before starting device
        if: inputs.mode == 'agent'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          test "$GEMINI_FREE_TIER_CONFIRMED" = true
          test -n "$GOOGLE_API_KEY"
          test -n "$GEMINI_MODEL"
      - name: Install bounded local inference backend
        if: inputs.mode == 'local'
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_CONTEXT_LENGTH: '8192'
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 240 https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          echo 'b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  /tmp/ollama.tar.zst' | sha256sum --check
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr/local
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          timeout 240 ollama pull qwen3.5:2b
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run public Android demo
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          OLLAMA_NO_CLOUD: '1'
          DEMO_MODE: ${{ inputs.mode }}
          GOOGLE_API_KEY: ${{ inputs.mode == 'agent' && secrets.GOOGLE_API_KEY || '' }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python demo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-demo-evidence
          path: out/
          if-no-files-found: ignore
          retention-days: 3
